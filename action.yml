name: 'Antigravity PR Code Reviewer'
description: 'Agente autônomo de Code Review para Pull Requests potencializado por Google Antigravity e Gemini'
author: 'Pablo Carmo'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  gemini_api_key:
    description: 'Chave de API do Google Gemini obtida no Google AI Studio'
    required: true
  github_token:
    description: 'GitHub Token para publicar comentário no Pull Request'
    required: false
    default: ${{ github.token }}
  agents_file:
    description: 'Caminho para arquivo customizado de diretrizes no repositório de destino'
    required: false
    default: 'AGENTS.md'
  gemini_model:
    description: 'Modelo específico do Gemini (ex: gemini-2.5-flash, gemini-1.5-pro). Usa o padrão do SDK quando omitido.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Sincronizar branch base
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ -n "$BASE_REF" ]; then
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
        fi

    - name: Executar Agente Antigravity
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        AGENTS_FILE: ${{ inputs.agents_file }}
        GEMINI_MODEL: ${{ inputs.gemini_model }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python "${{ github.action_path }}/scripts/ai_code_review.py"

    - name: Publicar Comentário no PR
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "::warning::PR_NUMBER não identificado. O comentário não pôde ser publicado."
          exit 0
        fi

        if [ -s review_output.md ]; then
          gh pr comment "$PR_NUMBER" --body-file review_output.md
        else
          echo "Nenhum arquivo review_output.md gerado ou arquivo vazio."
        fi
